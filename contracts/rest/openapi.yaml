# Контракт Platform <-> Admin Client (REST + WebSocket).
# Источник требований: ../../docs/TZ-5-platform.md (§3, §4.3, §4.4, §7), ../../docs/TZ-6-admin-client.md.
#
# Статус: черновик v0.1 — покрывает основные ресурсы для старта параллельной разработки
# Platform и Admin Client. Изменения — через PR (от файла зависят обе стороны).
# WebSocket-канал /events описан отдельно в конце файла (OpenAPI 3.1 не покрывает WS нативно).

openapi: 3.1.0
info:
  title: dist-vpn Platform API
  version: 0.1.0
  description: >
    REST API для управления пулом нод, каскадами, пользователями и мониторингом.
    Приватность: эндпоинты потребления (/usage) отдают только байтовые счётчики,
    без адресов назначения и содержимого трафика (см. TZ-5 §6.4).

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Вход администратора
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                totp_code: { type: string, description: "Код TOTP, если включена MFA (см. TZ-5 §6.3)" }
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { description: Неверные учётные данные }
        "429": { description: "Превышен лимит попыток (rate limiting, см. TZ-5 §6.3)" }

  /auth/refresh:
    post:
      summary: Обновление access-токена по refresh-токену (с ротацией)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { description: "Refresh-токен недействителен/отозван" }

  /auth/logout:
    post:
      summary: Отзыв текущего refresh-токена
      # Уточнено после реализации Admin Client (см. admin-client/README.md,
      # "Замечания к контракту"): без явного тела было неясно, какой именно
      # refresh-токен отзывать. refresh_token — опционально (не ломает уже
      # реализованный клиент, который его пока не отправляет), но рекомендуется
      # передавать явно, а не полагаться на то, что сервер сам сопоставит сессию
      # по access-токену из Authorization — тот может быть уже почти просрочен
      # или не содержать однозначного session id.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, description: "Рекомендуется передавать явно" }
      responses:
        "204": { description: OK }

  /auth/change-password:
    post:
      summary: >-
        Сменить пароль текущего администратора. Обязателен к вызову, если
        последний /auth/login вернул must_change_password=true (TZ-5 §6.3 —
        дефолтный сгенерированный пароль требует немедленной смены).
        Добавлено после реализации Platform, где поле already существовало
        в ответе логина, но точки, куда вести пользователя, не было.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: "Пароль изменён, must_change_password сброшен в false" }
        "401": { description: "current_password не совпадает" }

  /nodes:
    get:
      summary: Список нод пула
      parameters:
        - { name: role, in: query, schema: { $ref: "#/components/schemas/NodeRole" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/NodeStatus" } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Node" } }
                  total: { type: integer }
    post:
      summary: Сгенерировать одноразовый enrollment-токен для новой ноды (см. TZ-4 §5.2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_role]
              properties:
                requested_role: { $ref: "#/components/schemas/NodeRole" }
                label: { type: string, description: "Человекочитаемое имя ноды" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollment_token: { type: string }
                  expires_at: { type: string, format: date-time }

  /nodes/{node_id}:
    parameters:
      - { name: node_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Детали ноды
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
    patch:
      summary: Изменить роль/метаданные ноды
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/NodeRole" }
                label: { type: string }
                public_address: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
    delete:
      summary: Вывести ноду из эксплуатации (DECOMMISSIONED) — см. TZ-5 §4.1
      responses:
        "202": { description: "Принято, переконфигурация связанных каскадов запущена асинхронно" }

  /cascades:
    get:
      summary: Список каскадов
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Cascade" } }
                  total: { type: integer, description: "Согласовано с /nodes — обязательно для точной пагинации на клиенте" }
    post:
      summary: Собрать новый каскад (входная нода + пул выходных кандидатов)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CascadeInput" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cascade" }

  /cascades/{cascade_id}:
    parameters:
      - { name: cascade_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Детали каскада, включая текущий статус связок (для графа топологии в Admin Client)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cascade" }
    patch:
      summary: Изменить состав пула выходных нод-кандидатов
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CascadeInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cascade" }
    delete:
      summary: Разобрать каскад
      responses:
        "204": { description: OK }

  /cascades/{cascade_id}/events:
    parameters:
      - { name: cascade_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Журнал HealthEvent по каскаду (см. TZ-5 §4.3 — "что и где отвалилось")
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HealthEvent" }

  /cascades/{cascade_id}/test:
    parameters:
      - { name: cascade_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Инициировать тест-запрос по связке (см. TZ-5 §4.3, TZ-4 §3.4)
      responses:
        "202":
          description: "Тест запущен асинхронно, результат — через /tests/{test_id} или WebSocket"
          content:
            application/json:
              schema:
                type: object
                properties:
                  test_id: { type: string }

  /cascades/{cascade_id}/tests:
    parameters:
      - { name: cascade_id, in: path, required: true, schema: { type: string } }
    get:
      # Добавлено после реализации Admin Client (см. admin-client/README.md,
      # "Замечания к контракту"): ТЗ-5 §7 упоминал этот путь в прозе как
      # "история", но в самой YAML-схеме эндпоинта не было — история
      # тест-запросов существовала только как то, что клиент мог бы
      # накопить сам в локальном состоянии (терялось бы при перезагрузке
      # страницы). Формат ответа — тот же items+total конверт, что и у
      # остальных списков.
      summary: История тест-запросов по конкретной связке (TZ-5 §4.3, TZ-6 §3.2)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LinkTest" } }
                  total: { type: integer }

  /tests/{test_id}:
    parameters:
      - { name: test_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Результат конкретного тест-запроса (человекочитаемый, см. TZ-6 §3.2)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkTest" }

  /users:
    get:
      summary: Список пользователей VPN
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  total: { type: integer, description: "Согласовано с /nodes — обязательно для точной пагинации на клиенте" }
    post:
      summary: Создать пользователя (см. TZ-5 §4.4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cascade_ids]
              properties:
                name: { type: string }
                cascade_ids: { type: array, items: { type: string } }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Детали пользователя, включая агрегированное потребление (только объём)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      summary: Отозвать доступ пользователя (см. TZ-5 §4.4)
      responses:
        "204": { description: OK }

  /users/{user_id}/connection/{cascade_id}:
    # Добавлено после реализации Platform (тот же паттерн, что и /auth/change-password
    # выше) - ТЗ-5 §4.4/§9 требует, чтобы связка реально заработала для клиента, а
    # без готовой vless:// ссылки ни один шаг ТЗ не проверяем end-to-end: до этого
    # POST /users отдавал только uuid, а Hop A REALITY-инбаунд собирался с пустым
    # приватным ключом (см. platform/README.md "Отклонения от ТЗ") - оба пробела
    # закрыты вместе в этом слайсе.
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string } }
      - { name: cascade_id, in: path, required: true, schema: { type: string } }
    get:
      summary: >-
        Готовая vless:// ссылка для импорта в клиент (REALITY, Hop A этой связки).
        400, если у entry-ноды каскада не задан public_address (PATCH /nodes/{node_id}).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  vless_uri: { type: string }

  /usage:
    get:
      summary: Агрегированная статистика потребления — только байтовые счётчики (TZ-5 §6.4)
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: node_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UsageStat" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: "Секунды до истечения access-токена (15-30 минут, см. TZ-5 §6.3)" }
        must_change_password:
          type: boolean
          description: >-
            true, если пароль — сгенерированный при первом деплое дефолт и требует
            немедленной смены (TZ-5 §6.3). Уточнено после реализации Platform —
            изначально поле было только в реализации, не в контракте.
            Admin Client обязан показать экран смены пароля, если true, и не
            пускать дальше без вызова POST /auth/change-password.

    NodeRole:
      type: string
      enum: [entry, exit]

    NodeStatus:
      type: string
      enum: [enrolling, healthy, degraded, down, decommissioned]

    Node:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        role: { $ref: "#/components/schemas/NodeRole" }
        region: { type: string }
        status: { $ref: "#/components/schemas/NodeStatus" }
        agent_version: { type: string }
        last_heartbeat_at: { type: string, format: date-time }
        public_address:
          type: string
          description: >-
            Публичный адрес (IP или DNS-имя), по которому клиент должен подключаться,
            если эта нода — entry. Добавлено после реализации Platform (изначально
            поле было только в реализации, не в контракте, тот же паттерн, что и
            TokenPair.must_change_password выше) — админ-задаваемое через PATCH
            /nodes/{node_id}, никогда не выводится из Node.hostname (тот
            self-reported агентом при enrollment и не обязательно совпадает с
            публичным адресом).

    CascadeInput:
      type: object
      required: [entry_node_id, exit_node_ids]
      properties:
        entry_node_id: { type: string }
        exit_node_ids: { type: array, items: { type: string } }
        hop_a_presets: { type: array, items: { type: string }, description: "p1..p4, см. история пресетов в контексте проекта" }

    CascadeStatus:
      type: string
      enum: [up, degraded, down]

    Cascade:
      type: object
      properties:
        id: { type: string }
        entry_node_id: { type: string }
        exit_node_ids: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/CascadeStatus" }
        hop_a_presets: { type: array, items: { type: string } }
        hopa_reality_public_key:
          type: string
          description: >-
            Публичный REALITY-ключ Hop A (клиентского) инбаунда этой связки — только
            публичная часть, приватный ключ никогда не покидает Platform. Добавлено
            после реализации Platform, тот же паттерн, что и Node.public_address выше.
            Нужен вместе с hopa_reality_short_id для сборки vless:// (см. GET
            /users/{user_id}/connection/{cascade_id}).
        hopa_reality_short_id:
          type: string

    HealthEvent:
      type: object
      properties:
        id: { type: string }
        cascade_id: { type: string }
        node_id: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }

    TestOutcome:
      type: string
      enum: [success, container_start_failed, tls_handshake_failed, proxy_no_response, timeout]

    LinkTest:
      type: object
      properties:
        id: { type: string }
        cascade_id: { type: string }
        outcome: { $ref: "#/components/schemas/TestOutcome" }
        latency_ms: { type: integer }
        detail: { type: string, description: "Человекочитаемое пояснение (см. TZ-6 §3.2)" }
        initiated_by: { type: string, description: "'admin' или 'schedule'" }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        uuid: { type: string, description: "Личный VLESS-идентификатор пользователя, не меняется при ротации сервера" }
        cascade_ids: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }

    UsageStat:
      type: object
      description: "Только объём — намеренно нет никаких полей адреса/домена назначения (TZ-5 §6.4)"
      properties:
        user_id: { type: string }
        node_id: { type: string }
        period_start: { type: string, format: date-time }
        uplink_bytes: { type: integer }
        downlink_bytes: { type: integer }

# --- WebSocket-канал (описан текстом, вне схемы OpenAPI 3.1) ---
# GET /api/v1/events (Upgrade: websocket), Bearer-токен как query-параметр или Sec-WebSocket-Protocol.
# Сообщения сервера — JSON, оборачивающие один из: HealthEvent, Cascade (обновлённый статус),
# LinkTest (завершённый тест). Формат согласуется в первой реализации Platform (TZ-5 §7),
# закрепляется здесь отдельным AsyncAPI-описанием, когда появится первая версия.
