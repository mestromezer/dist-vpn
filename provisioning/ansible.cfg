; Ansible-конфигурация provisioning (ТЗ-7). Запускать ansible-playbook /
; ansible-galaxy из этой директории (provisioning/), чтобы относительные пути
; ниже разрешались правильно.

[defaults]
; По умолчанию указывает на документированный пример (inventory/example.ini),
; не на реальные хосты — реальный инвентарь (inventory/hosts.ini) оператор
; создаёт локально и передаёт явно через -i (см. README.md). Так соединение
; "по умолчанию" никогда не заденет настоящую ноду без явного -i/-l.
inventory = inventory/example.ini
roles_path = roles
collections_path = collections
; Секреты не должны попадать в *.retry файлы при сбое — исключаем сам механизм.
retry_files_enabled = False
interpreter_python = auto_silent
; Найдено при реальном деплое: community.general.yaml callback удалён в
; community.general >= 12.0.0 ("This feature was superseded by the option
; result_format=yaml in callback plugin ansible.builtin.default") — старое
; значение "yaml" здесь ссылалось именно на удалённый плагин и падало с
; "[ERROR]: The 'community.general.yaml' callback plugin has been removed."
; сразу на первой задаче. Актуальный способ получить тот же читаемый вывод —
; ниже.
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
; ControlPersist ускоряет повторные подключения в рамках одного прогона и,
; что важно для этого плейбука, позволяет доиграть текущий play на уже
; установленном соединении, даже если в процессе харднинга сам playbook
; отключил PermitRootLogin/PasswordAuthentication или сменил SSH-порт —
; активная (уже аутентифицированная) сессия не рвётся, рвутся только НОВЫЕ
; попытки логина. См. README → "Идемпотентность и bootstrap".
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15

; Проверка host key НЕ отключена (host_key_checking по умолчанию True) —
; намеренно: отключение глобально снижает защиту от MITM при самом первом
; подключении к новой VDS. Для самого первого подключения к свежей ноде
; оператор должен один раз вручную подтвердить SSH host key (обычным `ssh
; <host>` или `ssh-keyscan -H <host> >> ~/.ssh/known_hosts`) — см. README.
