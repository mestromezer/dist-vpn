---
# Общие НЕсекретные переменные для всех нод пула. Секреты — только через
# group_vars/all/vault.yml (см. vault.yml.example и README «Секреты и Vault»).
#
# provision_user специально задан здесь (а не только как default в
# roles/base_hardening), потому что его читают ДВЕ роли — base_hardening
# (создаёт пользователя) и docker_install (добавляет пользователя в группу
# docker) — единый источник истины исключает рассинхронизацию между ролями.

# Пользователь, создаваемый на каждой ноде для повседневной работы оператора.
provision_user: deploy

# Публичный SSH-ключ оператора, копируемый в authorized_keys нового
# пользователя. Пустое значение = провижининг явно остановится с понятной
# ошибкой (roles/base_hardening/tasks/user.yml), а не тихо создаст
# пользователя без единственного способа в него зайти.
#
# Переопределить, например:
#   ansible-playbook site.yml -e "provision_user_ssh_public_key=$(cat ~/.ssh/id_ed25519.pub)"
# или через host_vars/<host>.yml, если у разных нод разные операторские ключи.
provision_user_ssh_public_key: ""
