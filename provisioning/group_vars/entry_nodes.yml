---
# См. group_vars/exit_nodes.yml — тот же механизм, роль "exit".
role: entry

# Роль-специфичные allow-правила ufw для входных (Hop A) нод — ТЗ-7 §3.2/§4.2.
# Форма и механизм применения — roles/base_hardening/defaults/main.yml
# (role_firewall_rules) / roles/base_hardening/tasks/firewall.yml, уже
# готовы с прошлого слайса; здесь — реальные данные.
#
# 443/tcp — клиентский порт пресетов Hop A (P1–P4: VLESS+REALITY на RAW/
# XHTTP/gRPC, VLESS+TLS на WebSocket — см. docs/TZ-4-agent.md §2 таблица
# технологий и §3.3). Важная честная оговорка: ни TZ-3, ни TZ-4 НИГДЕ не
# фиксируют число "443" явным решением "порт = 443" — такого предложения в
# документах проекта просто нет (проверено grep'ом по всем docs/TZ-*.md).
# Число выведено технически, а не выдумано:
#   - TZ-4 §5.1 прямо описывает эти порты как "обычные VLESS-порты,
#     замаскированные под HTTPS";
#   - REALITY (см. TZ-3 §0 таблицу переносимых знаний, `realitySettings`)
#     по своей конструкции проксирует НАСТОЯЩИЙ TLS-хендшейк реального
#     HTTPS-сайта — а подавляющее большинство настоящих HTTPS-сайтов
#     обслуживается именно на tcp/443. Если бы Hop A слушал произвольный
#     порт, "маскировка под HTTPS" переставала бы быть правдоподобной перед
#     системами DPI-инспекции трафика (нетипичный порт для HTTPS сам по себе — сигнал для DPI) — то
#     есть 443 не столько "выбор", сколько прямое следствие уже описанного
#     в ТЗ-4 §5.1 поведения.
# Ограничение этого вывода: если реализация Agent'а в итоге поднимает
# НЕСКОЛЬКО пресетов одновременно на РАЗНЫХ портах (а не один общий 443 с
# разными inbound-тегами/SNI), этот список нужно будет расширить — на
# момент написания этого слайса provisioning код Agent'а, который реально
# поднимает пресеты, ещё не существует (см. agent/README.md на ветке
# agent/grpc-client-skeleton — реализован только control-plane gRPC-
# клиент, Xray/пресеты — следующий срез Agent'а), так что нет ещё более
# авторитетного источника, чем этот вывод.
role_firewall_rules:
  entry:
    - port: 443
      proto: tcp
      comment: "Hop A client-facing preset(s) — TZ-4 SS5.1 HTTPS masquerade"

# Backhaul Hop A<->Hop B и mTLS control-plane порт НЕ добавлены здесь как
# allow-правила — оба случая разобраны подробно в group_vars/exit_nodes.yml
# (то же обоснование в равной мере применимо к entry-стороне backhaul-связи
# и к mTLS-каналу, который использует и entry, и exit).
