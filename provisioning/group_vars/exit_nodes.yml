---
# См. group_vars/entry_nodes.yml — тот же механизм, роль "entry".
role: exit

# Роль-специфичные allow-правила ufw для выходных (Hop B) нод — ТЗ-7 §3.2/§4.2.
#
# НАМЕРЕННО пусто в этом слайсе — но теперь это осознанный вывод, а не
# просто "ещё не дошли руки" (как было в прошлом слайсе для ОБЕИХ ролей).
# ТЗ-7 §3.2 требует allow-правило для "порта(ов) backhaul Hop B (на обеих
# сторонах)", но ни точный порт, ни даже протокол этого канала нигде в
# проекте не зафиксированы (проверено — grep по всем docs/TZ-*.md не находит
# ни одного конкретного номера порта backhaul):
#
# docs/TZ-4-agent.md §6 прямо говорит: backhaul-транспорт Hop A<->Hop B —
# pluggable-выбор между:
#   (а) VLESS+REALITY chaining (по умолчанию/"не трогай, если работает") —
#       та же логика маскировки под HTTPS, что и у Hop A (см.
#       group_vars/entry_nodes.yml) — вероятно тоже tcp/443, но на ДРУГОЙ
#       ноде (exit, не entry) — отдельное правило, не переиспользование
#       записи entry;
#   (б) AmneziaWG (форк WireGuard-Go, UDP) — принципиально другой протокол.
# Дословно из ТЗ-4 §6: "решение, какой вариант использовать по умолчанию в
# production, — на этапе реализации". Это не "порт не указан", а "протокол
# ещё не выбран" — variant (а) это tcp, variant (б) это udp, и они по-разному
# ложатся даже на топологию: WireGuard-подобные протоколы (variant б)
# обычно симметричны — оба пира слушают свой локальный UDP-порт, поэтому
# ТЗ-7 §3.2 и говорит "на обеих сторонах" (это объясняет формулировку ТЗ-7,
# а не противоречит ей); VLESS-chaining (variant а) — обычное TCP-
# подключение, где слушает (нуждается в inbound-правиле) только принимающая
# сторона — то есть exit-нода, entry инициирует исходящее соединение и не
# слушает ничего для этой цели.
#
# Открывать порт "на всякий случай" под любую из двух гипотез — прямое
# нарушение ТЗ-7 §3.2 ("никаких портов на всякий случай", "роль явно
# определяет список правил"). Когда Agent реализует конкретный backhaul-
# транспорт (следующий срез Agent'а после agent/grpc-client-skeleton,
# см. agent/README.md "Scope of this slice") — заполнить здесь по факту,
# тем же способом, что и role_firewall_rules.entry в
# group_vars/entry_nodes.yml.
role_firewall_rules:
  exit: []

# --- Почему порт mTLS control-plane канала Agent<->Platform НЕ входит в
# role_firewall_rules ни здесь, ни в group_vars/entry_nodes.yml ---
#
# ТЗ-7 §3.2 упоминает "порт mTLS-канала Agent↔Platform" в списке того, что
# роль должна открывать — но фактическая архитектура делает inbound-правило
# для него не нужным ни на entry, ни на exit ноде:
#
#   - TZ-4 §5.1 прямо: "Agent не принимает входящих соединений для
#     control-plane" — модель dial-out/reverse-tunnel (по образцу Teleport,
#     см. ту же секцию): Agent САМ инициирует и держит открытым исходящее
#     соединение к Platform, Platform никогда не открывает соединение к
#     Agent'у первой.
#   - Это подтверждается и на уровне уже реализованного кода Agent'а (ветка
#     agent/grpc-client-skeleton): agent/src/dist_vpn_agent/config.py,
#     поле `platform_address` — адрес, КУДА Agent подключается исходящим
#     соединением (default "localhost:50051" для dev), а не порт, который
#     Agent слушает. Agent нигде не биндит серверный TCP/gRPC-сокет для
#     Platform.
#   - roles/base_hardening/tasks/firewall.yml уже разрешает ВЕСЬ outgoing
#     трафик по умолчанию ("Политика по умолчанию: allow outgoing") — то
#     есть исходящее соединение Agent'а к Platform уже ничем не блокируется
#     без единой дополнительной строки.
#
# Итог: инициатор соединения (Agent) ничего не слушает и не нуждается во
# входящем allow-правиле; получатель (Platform) — не в периметре этого
# провижининга (Platform — отдельный компонент/хост, вне scope ТЗ-7).
# Добавление сюда "allow-правила для mTLS-порта" было бы разрешением
# ВХОДЯЩИХ соединений туда, где по архитектуре их никогда не бывает — то
# есть было бы тем самым "портом на всякий случай", который ТЗ-7 §3.2
# запрещает.
