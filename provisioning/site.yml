---
# Provisioning базовой подготовки VDS перед установкой Agent (ТЗ-7).
#
# Запуск — см. provisioning/README.md, кратко:
#   ansible-playbook -i inventory/hosts.ini site.yml -l <host> -e role=entry --ask-vault-pass
#
# Роль ноды (entry|exit) — из group_vars (group_vars/entry_nodes.yml /
# exit_nodes.yml, привязано к членству в группе инвентаря) либо явно через
# -e role=entry|exit (extra-vars всегда приоритетнее group_vars в Ansible).
# Используется ролями для роль-специфичного набора firewall-портов — в этом
# слайсе список портов пуст и это ожидаемо, см. README «Scope of this
# slice / TODO».
#
# SSH-хардненинг применяется ДО какой-либо иной настройки (ТЗ-7 §5) —
# обеспечивается порядком ролей ниже (base_hardening всегда первая).

- name: Базовая подготовка VDS перед установкой Agent
  hosts: vds
  become: true
  gather_facts: true

  pre_tasks:
    - name: Убедиться, что роль ноды определена корректно
      ansible.builtin.assert:
        that:
          # Единое (не составное) условие — если "role" не задан вовсе,
          # короткое замыкание "and" не даёт Jinja упасть на "role in [...]"
          # с невнятной ошибкой вместо понятного fail_msg ниже.
          - (role is defined) and (role in ['entry', 'exit'])
        fail_msg: >-
          Роль ноды не определена или некорректна
          ({{ role | default('не задана') }}). Укажите -e role=entry|exit,
          либо поместите хост в группу инвентаря entry_nodes/exit_nodes
          (см. inventory/example.ini и group_vars/entry_nodes.yml,
          group_vars/exit_nodes.yml).
        success_msg: "Роль ноды: {{ role }}"

  roles:
    - role: base_hardening
    - role: docker_install

  post_tasks:
    - name: "TODO (следующий слайс): установка и enrollment Agent'а"
      ansible.builtin.debug:
        msg: >-
          Базовая подготовка ноды завершена (роль: {{ role }}). Установка
          Docker-образа Agent'а и enrollment к Platform (ТЗ-4 §5.2, ТЗ-7
          §4.3-4.4) — TODO следующего слайса provisioning: зависит от
          готового Docker-образа Agent'а (параллельный, отдельный трек
          разработки). Переменные-плейсхолдеры для этого шага
          (agent_platform_address, agent_enrollment_token) уже
          задокументированы в group_vars/all/vault.yml.example. Эта нода
          пока НЕ проверяется на появление в реестре Platform со статусом
          HEALTHY — см. README «Scope of this slice / TODO».
