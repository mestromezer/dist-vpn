; Документированный ПРИМЕР инвентаря — НЕ реальные хосты.
;
; Использование:
;   cp inventory/example.ini inventory/hosts.ini
;   # отредактировать inventory/hosts.ini — вписать реальные IP/hostname.
; inventory/hosts.ini уже в .gitignore (см. provisioning/.gitignore) — реальные
; адреса нод пула не попадают в git.
;
; Роль ноды (entry|exit) определяется тем, в какую группу попал хост
; (см. group_vars/entry_nodes.yml, group_vars/exit_nodes.yml), либо явно
; переопределяется через -e role=entry|exit при запуске ansible-playbook
; (extra-vars имеют приоритет над group_vars).

[entry_nodes]
; входная нода (Hop A) — принимает клиентские подключения.
; Первое подключение к свежей VDS — всегда root (у хостера ещё нет
; непривилегированного пользователя), поэтому ansible_user=root указан явно
; для самого первого прогона. После него провижининг создаёт sudo-пользователя
; (group_vars/all/main.yml: provision_user) и отключает root-логин по SSH —
; для повторных прогонов сменить ansible_user на provision_user.
; vds-entry-01 ansible_host=203.0.113.10 ansible_user=root

[exit_nodes]
; выходная нода (Hop B) — конечная точка перед открытым интернетом.
; vds-exit-01 ansible_host=198.51.100.20 ansible_user=root

[vds:children]
entry_nodes
exit_nodes

[vds:vars]
ansible_python_interpreter=/usr/bin/python3
