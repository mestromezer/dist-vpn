---
- name: Определить фактический тег/имя образа для запуска
  ansible.builtin.set_fact:
    agent_effective_image: "{{ agent_image_tag if agent_image_source == 'build_from_source' else agent_registry_image }}"

- name: Определить, передан ли клиентский mTLS-материал
  ansible.builtin.set_fact:
    agent_client_cert_provided: "{{ agent_mtls_client_cert_src | length > 0 }}"

# Пути ВНУТРИ контейнера — фиксированы (не настраиваются переменными),
# чтобы bind-mount (ниже) и переменные окружения AGENT_MTLS_*_PATH,
# передаваемые в контейнер, не могли рассинхронизироваться.
- name: Определить пути mTLS-материала внутри контейнера
  ansible.builtin.set_fact:
    agent_container_ca_path: /etc/dist-vpn-agent/tls/platform-ca.pem
    agent_container_client_cert_path: /etc/dist-vpn-agent/tls/client-cert.pem
    agent_container_client_key_path: /etc/dist-vpn-agent/tls/client-key.pem

- name: Создать каталог для mTLS-материала Agent'а на хосте
  ansible.builtin.file:
    path: "{{ agent_mtls_ca_cert_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not agent_insecure_dev_mode

- name: Скопировать CA-сертификат Platform на целевой хост
  ansible.builtin.copy:
    src: "{{ agent_mtls_ca_cert_src }}"
    dest: "{{ agent_mtls_ca_cert_dest }}"
    owner: root
    group: root
    mode: "0644" # CA-сертификат -- публичный якорь доверия, не секрет сам по себе
  when: not agent_insecure_dev_mode

- name: Скопировать клиентский mTLS-сертификат ноды (опционально, см. defaults/main.yml)
  ansible.builtin.copy:
    src: "{{ agent_mtls_client_cert_src }}"
    dest: "{{ agent_mtls_client_cert_dest }}"
    owner: root
    group: root
    mode: "0644"
  when: agent_client_cert_provided | bool

# ВАЖНАЯ ЧЕСТНАЯ ОГОВОРКА про права доступа к приватному ключу: TZ-4 §5.3
# требует "права доступа 600, отдельный непривилегированный пользователь
# для процесса Agent". Внутри контейнера Agent реально работает под
# непривилегированным пользователем `agent` (agent/Dockerfile: `USER
# agent`), но у bind mount'а (в отличие от именованного Docker volume с
# chown) нет перетрансляции UID/GID между хостом и контейнером — mode
# "0600 root:root" на ХОСТЕ сделал бы файл НЕЧИТАЕМЫМ для процесса внутри
# контейнера (если только UID `agent` внутри контейнера случайно не
# совпадёт с UID root/иным на хосте, на что нельзя полагаться). Это
# известный, а не спрятанный компромисс -- см. README "agent_install:
# ограничение по правам клиентского ключа" за развёрнутым обсуждением
# альтернатив (именованный volume с init-контейнером chown, Docker
# secrets и т.д.), ни одна из которых не реализована в этом слайсе.
# Практическое смягчение: в этом слайсе Agent (agent/grpc-client-skeleton)
# ещё не персистит и не использует полученный сертификат автоматически
# (см. defaults/main.yml) -- то есть этот путь на практике сейчас почти
# никогда не заполнен.
- name: Скопировать клиентский mTLS-ключ ноды (опционально, см. defaults/main.yml)
  ansible.builtin.copy:
    src: "{{ agent_mtls_client_key_src }}"
    dest: "{{ agent_mtls_client_key_dest }}"
    owner: root
    group: root
    mode: "0644"
  no_log: true
  when: agent_client_cert_provided | bool

- name: Собрать список bind-mount'ов mTLS-материала для контейнера
  ansible.builtin.set_fact:
    agent_container_volumes: "{{ agent_container_volumes | default([]) + [(agent_mtls_ca_cert_dest ~ ':' ~ agent_container_ca_path ~ ':ro')] }}"
  when: not agent_insecure_dev_mode

- name: Добавить bind-mount клиентского сертификата/ключа (если заданы)
  ansible.builtin.set_fact:
    agent_container_volumes: >-
      {{ agent_container_volumes | default([]) +
         [(agent_mtls_client_cert_dest ~ ':' ~ agent_container_client_cert_path ~ ':ro'),
          (agent_mtls_client_key_dest ~ ':' ~ agent_container_client_key_path ~ ':ro')] }}
  when: agent_client_cert_provided | bool

# env передаётся через Docker Engine API (community.docker.docker_container
# использует docker-py, не шеллит `docker run -e ...`), так что токен/адрес
# никогда не попадают в аргументы процесса на хосте (`ps aux` их не
# покажет) и не в shell-историю — ТЗ-7 §5 требование выполнено на этом
# уровне. Честная оговорка (см. README за развёрнутым обсуждением): это НЕ
# скрывает значения от `docker inspect dist-vpn-agent` — Docker хранит
# резолвнутые env-переменные контейнера в открытом виде в своих метаданных
# независимо от того, как их передали (-e, --env-file или API), это
# ограничение самого Docker, а не конкретного выбора модуля здесь. Доступ к
# docker inspect уже ограничен тем же доверенным периметром, что и доступ к
# самому хосту (root, provision_user из группы docker), так что это не
# новая поверхность атаки, но и не полная защита секрета в состоянии покоя.
- name: Запустить контейнер Agent'а
  community.docker.docker_container:
    name: "{{ agent_container_name }}"
    image: "{{ agent_effective_image }}"
    state: started
    restart_policy: "{{ agent_restart_policy }}"
    volumes: "{{ agent_container_volumes | default([]) }}"
    env:
      AGENT_PLATFORM_ADDRESS: "{{ agent_platform_address }}"
      AGENT_ENROLLMENT_TOKEN: "{{ agent_enrollment_token }}"
      AGENT_HOSTNAME: "{{ inventory_hostname }}"
      AGENT_REQUESTED_ROLE: "{{ agent_requested_role }}"
      AGENT_HEARTBEAT_INTERVAL_SECONDS: "{{ agent_heartbeat_interval_seconds | string }}"
      AGENT_LOG_LEVEL: "{{ agent_log_level }}"
      AGENT_INSECURE_DEV_MODE: "{{ agent_insecure_dev_mode | string | lower }}"
      AGENT_MTLS_CA_CERT_PATH: "{{ agent_container_ca_path if not agent_insecure_dev_mode else '' }}"
      AGENT_MTLS_CLIENT_CERT_PATH: "{{ agent_container_client_cert_path if agent_client_cert_provided else '' }}"
      AGENT_MTLS_CLIENT_KEY_PATH: "{{ agent_container_client_key_path if agent_client_cert_provided else '' }}"
  no_log: true
