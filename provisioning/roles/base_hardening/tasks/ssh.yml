---
- name: Убедиться, что sshd_config подключает /etc/ssh/sshd_config.d/*.conf
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

- name: Развернуть sshd hardening drop-in (ТЗ-7 §3.1)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

# Handler "Restart sshd" срабатывает только если что-то реально изменилось
# (идемпотентность). Явный flush здесь — чтобы к моменту, когда сработает
# firewall.yml (открытие ssh_port в ufw), sshd уже слушал именно этот порт,
# а не оставался в неопределённом промежуточном состоянии до конца роли.
- name: Применить SSH-хардненинг немедленно (до перехода к firewall)
  ansible.builtin.meta: flush_handlers
