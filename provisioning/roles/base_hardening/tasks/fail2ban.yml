---
- name: Установить fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Настроить jail.local: sshd jail (ТЗ-7 §3.3)"
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Убедиться, что fail2ban включён и запущен
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
