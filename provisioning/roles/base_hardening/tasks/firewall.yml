---
- name: Установить ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

# Порядок ниже намеренно такой: сначала политика по умолчанию и allow-правила
# (в т.ч. SSH), и только В САМОМ КОНЦЕ — включение ufw. Так на первом прогоне
# (ufw ещё выключен) нет ни секунды, когда правила уже "deny all", а SSH ещё
# не разрешён — самоблокировка невозможна по конструкции порядка задач.

- name: "Политика по умолчанию: deny incoming"
  community.general.ufw:
    direction: incoming
    policy: deny

- name: "Политика по умолчанию: allow outgoing"
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Разрешить SSH-порт (единственное allow-правило на этом этапе, ТЗ-7 §3.2)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | string }}"
    proto: tcp
    comment: "SSH — base_hardening"
  when: ufw_allow_ssh | bool

- name: "Роль-специфичные порты поверх SSH (role={{ role | default('unknown') }})"
  community.general.ufw:
    # По умолчанию allow, но элемент списка может задать rule: limit — тот же
    # механизм, которым сам ufw уже эффективно защищает SSH (community.general.ufw
    # не трогает SSH-порт как limit сам по себе, но семантика identична тому, как
    # fail2ban защищает SSH: ufw limit банит источник, слишком часто открывающий
    # новые соединения). Используется platform_nodes (group_vars/platform_nodes.yml)
    # для gRPC-портов Platform — найдено при аудите нового enrollment-порта
    # (см. platform/src/dist_vpn_platform/grpc_server/server.py): порт, не
    # требующий клиентского сертификата, обязан быть хотя бы rate-limited на
    # уровне сети (OWASP API4:2023, Unrestricted Resource Consumption).
    rule: "{{ item.rule | default('allow') }}"
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default('role-specific: ' ~ role) }}"
  loop: "{{ role_firewall_rules[role] | default([]) }}"
  when: role is defined and role in role_firewall_rules
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"

- name: Включить ufw
  community.general.ufw:
    state: enabled
