---
- name: Установить unattended-upgrades и apt-listchanges (ТЗ-7 §3.4)
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: unattended_upgrades_enabled | bool

- name: Включить автоматические security-обновления (20auto-upgrades)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when: unattended_upgrades_enabled | bool
