---
# Найдено при валидации реального деплоя на 3 VDS: Platform до этой роли
# разворачивался только вручную по шагам из deploy.md (голый `docker compose up`,
# ручной Caddy-контейнер по SSH, ручные правила ufw) — ни один из этих шагов не был
# воспроизводимым или версионируемым, в отличие от agent_install. Эта роль
# сворачивает их в тот же однокомандный поток `ansible-playbook site.yml -e
# role=platform`, которым уже разворачиваются entry/exit-ноды.
#
# Форма и обоснование выбора build_from_source по умолчанию — то же самое, что и
# roles/agent_install/defaults/main.yml (см. этот файл и provisioning/README.md
# "Agent: сборка образа — откуда и почему" за развёрнутым обоснованием): на момент
# написания этой роли у проекта нет ни CI/CD, публикующего готовые образы Platform в
# реестр, ни самого реестра — единственное, что реально существует и закоммичено,
# это platform/Dockerfile + platform/docker-compose.yml.
platform_source_git_repo: ""
platform_source_git_ref: ""
platform_source_checkout_dir: /opt/dist-vpn/platform-src

# См. roles/agent_install/defaults/main.yml (agent_source_github_pat) за полным
# обоснованием — тот же общий токен, тот же репозиторий.
platform_source_github_pat: "{{ vault_github_pat | default('') }}"
platform_source_git_repo_authenticated: >-
  {{ platform_source_git_repo | regex_replace('^https://', 'https://' ~ platform_source_github_pat ~ '@')
     if (platform_source_github_pat | length > 0) else platform_source_git_repo }}

# --- Порты Platform (совпадают с дефолтами platform/.env.example /
# platform/docker-compose.yml — единый источник истины для самих значений; эта роль
# лишь передаёт их дальше в шаблон docker-compose.override.yml.j2 и в ufw-правила
# group_vars/platform_nodes.yml, которые обязаны совпадать с этими же числами) ---
platform_http_port: 8000
platform_grpc_port: 50051
# Без клиентского сертификата вообще — только Enrollment, см.
# platform/src/dist_vpn_platform/grpc_server/server.py за полным обоснованием "почему
# два порта, а не один опциональный".
platform_grpc_enrollment_port: 50052
platform_db_port: 5432
platform_admin_client_port: 5173

# --- Секреты (Ansible Vault, group_vars/all/vault.yml.example) --- Пусто по
# умолчанию = явная ошибка в preflight (tasks/preflight.yml), а не молчаливый
# докер-компоуз с дефолтным "platform:platform"/"dev-only-insecure-secret-change-me"
# паролем в проде — тот же принцип, что и agent_platform_address/
# agent_enrollment_token в roles/agent_install/defaults/main.yml.
platform_jwt_secret_key: "{{ vault_platform_jwt_secret_key | default('') }}"
platform_postgres_password: "{{ vault_platform_postgres_password | default('') }}"

# --- Домен и TLS (roles/platform_install/templates/Caddyfile.j2) --- Пусто по
# умолчанию = Caddy поднимается на `tls internal` (самоподписанный сертификат,
# сгенерированный самим Caddy) — рабочий, но не доверенный внешними браузерами без
# ручного импорта корневого сертификата Caddy. Production-ready финал — задать
# platform_domain, указывающий DNS-записью на publiс IP этой ноды: тогда Caddy сам
# получит настоящий Let's Encrypt-сертификат. См. SECRETS-ROTATION.md за maintenance-
# пунктом "перейти на Let's Encrypt, когда появится домен".
platform_domain: ""

# --- Admin Client (собирается ЛОКАЛЬНО, на машине оператора — не на целевом хосте)
# --- Vite вшивает VITE_API_URL В САМ БАНДЛ на этапе сборки (это build-time, не
# runtime переменная — см. deploy.md/README.md за тем же обоснованием), поэтому
# сборка не может happen на целевом хосте вместе с остальным (там нет исходников
# admin-client в разработческом окружении с Node.js, да и незачем — итог сборки
# всего лишь статические файлы). local_action-шаги (tasks/admin_client.yml)
# запускают `npm ci && npm run build` НА МАШИНЕ ОПЕРАТОРА (delegate_to: localhost),
# точно тот же процесс, что раньше выполнялся вручную по deploy.md шаг за шагом.
# Требует Node.js/npm, установленных на машине оператора — та же зависимость, что
# была и раньше, просто теперь автоматизирована.
platform_admin_client_src_dir: "{{ playbook_dir }}/../admin-client"
# Пусто = `https://{{ platform_domain }}/api/v1`, если задан platform_domain, иначе
# `https://{{ ansible_host }}/api/v1` (самоподписанный Caddy) — см. tasks/admin_client.yml.
platform_admin_client_api_url: ""

# --- Образы вспомогательных контейнеров (Caddy, nginx для Admin Client) --- Без
# закреплённой версии (:latest/:alpine) — тот же самый, не устранённый в этом
# слайсе компромисс, что и agent_docker_proxy_image в roles/agent_install/defaults/
# main.yml (нет собственного пайплайна, публикующего закреплённый тег) — оператор
# должен закрепить версию сам перед production-раскаткой, см. README.
platform_caddy_image: caddy:2-alpine
platform_admin_client_nginx_image: nginx:alpine

# --- CA-сертификат (roles/platform_install/tasks/ca_cert.yml) --- Куда на машине
# ОПЕРАТОРА сохранить CA-сертификат, забранный из тома Platform после первого
# старта. Передайте этот путь как agent_mtls_ca_cert_src при последующем
# провижининге entry/exit-нод (roles/agent_install).
platform_ca_cert_local_dest: "~/platform-ca.pem"

# --- Control-plane REALITY gateway (roles/platform_install/tasks/control_gateway.yml) ---
# Найдено фактическим tcpdump-диагностированием (см. provisioning/README.md,
# "Control-plane через REALITY, зачем"): ТСПУ пропускает голый TCP-хендшейк к
# 50051/50052, но режет первый же пакет с данными (TLS ClientHello) — self-signed
# сертификат без домена к тому же сам по себе похож на паттерн, по которому
# фильтруют. Обычный домен+Let's Encrypt здесь не помог бы надёжно (см. июнь-2026
# статьи про переход ТСПУ на поведенческий fingerprinting, а не только SNI/сертификат) —
# вместо этого заворачиваем control-plane трафик в тот же VLESS+REALITY, что уже
# доказанно проходит (services/xray_templates.py, security/reality_keys.py на
# стороне Platform — тот же код используется для генерации ключей ниже).
#
# false по умолчанию — тот же принцип "явный opt-in", что и agent_insecure_dev_mode:
# включать только когда реально нужно (появилась entry-нода в РФ), а не всегда.
# Когда true — Caddy ОБЯЗАН уйти на loopback (см. platform_caddy_bind_*
# ниже/Caddyfile.j2), т.к. control-gateway забирает себе публичный 443.
platform_control_gateway_enabled: false

# Официальный образ Xray-core (github.com/XTLS/Xray-core/pkgs/container/xray-core) —
# без прав root внутри, без shell, публикуется самим XTLS org, не сторонней сборкой.
# Без закреплённой версии (:latest) — тот же класс компромисса, что и
# agent_docker_proxy_image/platform_caddy_image (нет собственного пайплайна, публикующего
# закреплённый тег) — оператор должен закрепить версию сам перед production-раскаткой.
platform_control_gateway_image: "ghcr.io/xtls/xray-core:latest"
platform_control_gateway_container_name: dist-vpn-control-gateway
platform_control_gateway_port: 443

# UID/GID официального образа Xray-core — distroless "nonroot" база (WorkingDir
# /home/nonroot в docker inspect подтверждает это), без shell/`id` внутри, поэтому
# не проверить тем же способом, что agent_container_uid (docker run --entrypoint id
# здесь падает: "id": executable file not found). Взято из фактического
# `docker inspect` реально запущенного контейнера на живом VDS-A ("User": "65532") —
# тот же класс гочи, что и с agent_xray_config_host_dir: bind-mount не
# транслирует UID/GID, конфиг-файл на хосте должен быть заранее chown'нут на этот
# UID, иначе непривилегированный процесс внутри контейнера не сможет его прочитать
# (поймано этой же сессией: control-gateway падал в restart loop с "permission
# denied" на /etc/xray/config.json, пока владелец файла был root:root).
platform_control_gateway_container_uid: 65532
platform_control_gateway_container_gid: 65532

# REALITY-идентичность самого gateway (приватный ключ — секрет, живёт ТОЛЬКО в Ansible
# Vault, никогда не должен попадать в этот файл со значением). Публичный ключ и
# shortId — те же значения, что нужно будет передать entry-нодам как
# agent_control_plane_tunnel_public_key/agent_control_plane_tunnel_short_id
# (roles/agent_install/defaults/main.yml). Сгенерированы один раз через тот же
# security/reality_keys.py, что уже используют per-cascade REALITY-ключи Platform —
# см. group_vars/all/vault.yml.example за инструкцией, как сгенерировать свою пару.
platform_control_gateway_private_key: "{{ vault_control_gateway_reality_private_key | default('') }}"
platform_control_gateway_short_id: "{{ vault_control_gateway_reality_short_id | default('') }}"

# VLESS-идентичность клиента (entry-нод), которой control-gateway разрешает
# рукопожатие. ЧЕСТНАЯ ОГОВОРКА: один общий UUID на ВСЕ entry-ноды с включённым
# туннелем, а не отдельный per-node — упрощение этого среза, не забытая деталь.
# Не ослабляет реальную аутентификацию ноды: этот UUID даёт только доступ к
# самому REALITY-транспорту (может ли клиент вообще открыть туннель до
# 127.0.0.1:50051/50052), а КТО это за нода — по-прежнему решает mTLS-сертификат/
# enrollment-токен ВНУТРИ туннеля (security/mtls_ca.py), который этот срез не
# трогает. Следствие упрощения: отозвать доступ к туннелю можно только для всех
# entry-нод сразу (перегенерировать UUID и перекатить обе роли), не для одной.
# Если понадобится точечный отзыв — вынести в host_vars per-node (см.
# provisioning/README.md за тем, почему это не сделано сразу в этом срезе).
platform_control_gateway_client_uuid: "{{ vault_control_gateway_client_uuid | default('') }}"

# Донор-камуфляж (REALITY "dest"/serverNames) — сайт, чей настоящий TLS-хендшейк
# REALITY одалживает. Тот же пул принципов, что REALITY_DONOR_POOL в
# platform/src/dist_vpn_platform/services/xray_templates.py (реальный TLS 1.3 сайт,
# не хардкодить один и тот же домен на весь флот навсегда), но это ОТДЕЛЬНЫЙ канал
# от пользовательских каскадов, так что намеренно не переиспользует ту же
# Python-функцию выбора (control-gateway один на всю Platform-ноду, а не per-cascade) —
# оператор может сменить донора вручную, если понадобится.
platform_control_gateway_donor: "img.yandex.ru"

# ⚠️ [Эксперимент, см. README.md "Control-plane через REALITY"] XHTTP вместо
# raw TCP — network: "raw" достоверно проходил ClientHello непоследовательно
# даже с fragment/dialerProxy (см. README, финальные факты предыдущей сессии) —
# XHTTP меняет саму форму трафика (запрос/ответ вместо одного долгого потока),
# что независимо рекомендовано и XTLS-документацией, и community-обсуждением
# именно этого симптома (VLESS TLS handshake blocking в РФ). ДОЛЖЕН совпадать
# буквально с agent_control_plane_tunnel_xhttp_path на entry-ноде.
platform_control_gateway_xhttp_path: "/api/v1/events"

# --- Caddy: loopback-only, когда control-gateway забрал публичный 443 ---
# platform_control_gateway_enabled: true означает, что снаружи Caddy больше не
# достать напрямую — доступ к Admin Client/REST API только через SSH-port-forward
# оператора (ssh -L <port>:127.0.0.1:{{ platform_caddy_bind_port }} <host>, см.
# provisioning/README.md). Осознанный компромисс: без домена ACME (порт 80) всё
# равно не используется (tls internal, самоподписанный), так что публичная
# экспозиция Caddy давала только доступ к самой админке — а она и так
# чувствительный компонент (полный контроль над флотом), закрытие её от публичного
# интернета — это ужесточение само по себе, не только следствие занятого порта 443.
platform_caddy_bind_port: 8443
